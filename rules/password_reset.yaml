rules:
  - id: thiagoteixeira.django.security.password-reset.reset-token-never-verified
    languages: [python]
    severity: ERROR
    message: >-
      This view takes a reset token from the URL and calls set_password(), but never
      calls check_token(). A token that is only looked up - not verified - carries no
      expiry and no binding to the account's current state, so a reset link that
      leaked (proxy log, browser history, Referer, mailbox backup) stays a working
      credential indefinitely, and a link already spent can be replayed. Verify with
      django.contrib.auth.tokens.default_token_generator.check_token(user, token)
      before the write: its hash input includes the user's password hash, last_login
      and a timestamp, so the token expires against PASSWORD_RESET_TIMEOUT and
      self-invalidates the moment the password changes. Better still, use
      django.contrib.auth.views.PasswordResetConfirmView, which does this for you.
    metadata:
      # dual-listed: rule metadata is machine-read, and the Semgrep registry
      # carries both editions during the changeover
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
        - "A07:2025 - Authentication Failures"
      cwe: "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      asvs: "5.0.0 V6.4.3"
      confidence: MEDIUM
      references:
        - https://thiagoteixeira.tech/blog/password-reset-flows-why-a-uuid4-in-a-database-row-is-a-password-that-never-expires/
        - https://docs.djangoproject.com/en/5.2/topics/auth/default/#django.contrib.auth.tokens.PasswordResetTokenGenerator
    # Why this rule exists. Unlike Lab 09, the problem here is not that the registry
    # rule is curated-excluded or misses a shape - it is that NO rule in ANY tier
    # says anything about this class. Empirically, against labs/post_14_password_reset
    # (see its scans/README.md):
    #
    #   * Bandit 1.9.4: 5 findings, all B105/B106 hardcoded-password noise in seed.py
    #     and tests.py. Zero findings in any view file. The defect is the ABSENCE of a
    #     call, which has no AST node to match - the same blind spot as Lab 13.
    #   * Semgrep community (p/django + p/python + p/owasp-top-ten, 156 rules): 2
    #     findings, and they are the SAME rule on BOTH halves -
    #     use-none-for-password-default, about `""` vs `None` as a .get() default,
    #     on a line both views share. It cannot tell the two apart.
    #   * Semgrep audit/registry tier (r/python.django + r/python, 372 rules): 17
    #     findings, and every single one lands on the vulnerable and secure views in
    #     MATCHING PAIRS - no-csrf-exempt x2 each, unvalidated-password x1 each,
    #     use-none-for-password-default x1 each, direct-use-of-httpresponse x1 each.
    #     Not one rule separates a reset flow that verifies its token from one that
    #     does not.
    #
    # That is the "can't distinguish" outcome in the series' own decision table
    # (SECURITY_BLOG_SERIES_PLAN.md 6.4.1), and it is what warrants a custom rule.
    #
    # The rule is deliberately syntactic: a function that receives a token-shaped
    # parameter and reaches set_password() without check_token() appearing anywhere
    # in its body. It is scoped to the function, so - unlike the registry's
    # unvalidated-password, whose pattern-not-inside fences are scope-local - a
    # check_token() call anywhere in the same function clears it, including inside a
    # helper-assigned local or a guard clause that returns early.
    #
    # Known limit (marked todoruleid in rules/password_reset.py): a view that reads
    # the token from request.POST instead of a URL kwarg has no token parameter to
    # key on, and is not flagged. Keying on the signature is what keeps the rule from
    # firing on every authenticated "change your password" view, which legitimately
    # calls set_password() with no token anywhere.
    #
    # Being syntactic, it also accepts ANY check_token() in the body - one whose
    # result is ignored, one in a branch that logs and carries on, one run against
    # the wrong user - and misses a token parameter not named like one, **kwargs,
    # and a set_password() moved into a helper. It misfires on a class-based view
    # that verifies in dispatch() and writes in post(), and on an authenticated
    # view that happens to take an `auth_token` parameter.
    patterns:
      - pattern: |
          def $VIEW(..., $TOKEN, ...):
              ...
              $USER.set_password(...)
              ...
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i)^.*token.*$
      # The deep-expression operator <... ...> is required, not stylistic: a plain
      # `$GEN.check_token(...)` line only matches the call in STATEMENT position
      # (`verified = generator.check_token(...)`) and misses it inside an `if not
      # generator.check_token(...)` condition, which is how almost everyone writes
      # the guard. Without this the rule false-positives on correct code.
      - pattern-not: |
          def $VIEW(...):
              ...
              <... $GEN.check_token(...) ...>
              ...
