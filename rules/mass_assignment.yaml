rules:
  - id: thiagoteixeira.django.security.mass-assignment.model-fields-all
    languages: [python]
    severity: WARNING
    message: >-
      A ModelForm/ModelSerializer Meta uses fields = "__all__", so every editable field on
      the model is bindable from the request — including any permission field
      (is_staff, is_superuser, role) or otherwise sensitive column. This is a
      mass-assignment (over-posting) sink: a client can set fields the feature
      never meant to expose, e.g. POST role=staff to self-promote. Enumerate an
      explicit allowlist instead: fields = ["display_name", "bio"].
    metadata:
      # dual-listed: rule metadata is machine-read, and the Semgrep registry
      # carries both editions during the changeover
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
        - "A08:2025 - Software or Data Integrity Failures"
      cwe: "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      asvs: "4.0.3 V5.1.2"
      confidence: MEDIUM
      references:
        - https://thiagoteixeira.tech/blog/privilege-escalation-how-fields-all-hands-every-user-the-keys-to-your-django-admin/
        - https://thiagoteixeira.tech/blog/mass-assignment-how-over-posting-rewrites-fields-your-form-never-showed-and-how-explicit-field-lists-stop-it/
        - https://docs.astral.sh/ruff/rules/django-all-with-model-form/
    # Why this rule exists (and is not a community rule): the standard SAST tools
    # MISS this class. Bandit ships 42 plugin tests, all dangerous-CALL/construct
    # checks; none looks at a ModelForm/Serializer field list. The Semgrep
    # community packs (p/django, p/python, p/owasp-top-ten) report 0 on both the
    # fields="__all__" view and the explicit-list view, and even the registry
    # ruleset r/python.django has no rule for it (only the unrelated XSS audit
    # rule direct-use-of-httpresponse fires). The tools that DO flag this are
    # dedicated Django linters — Ruff's DJ007 (django-all-with-model-form) and
    # flake8-django's DJ07 — not the SAST toolchain this series runs. So a custom
    # Semgrep rule earns its place.
    #
    # Shared by Post 7 (privilege escalation — the exposed field is a role/permission
    # flag) and Post 10 (mass assignment — a non-permission field); same sink, the
    # posts differ by which field is exposed and the resulting impact.
    #
    # It also catches the other spellings of "every field": Django's own
    # ALL_FIELDS constant, an empty exclude, and modelform_factory(...,
    # fields="__all__"). Known limits (documented in rules/mass_assignment.py):
    # a non-empty `exclude = [...]` denylist is a related but distinct
    # antipattern and is not caught (# todoruleid); and the rule cannot tell a
    # model Meta from a django-filter FilterSet Meta, which it flags too
    # (# todook). It also cannot know whether the model carries anything
    # sensitive, or whether read_only_fields covers every field, hence MEDIUM
    # confidence.
    pattern-either:
      - patterns:
          - pattern-inside: |
              class Meta:
                  ...
          - pattern-either:
              - pattern: fields = "__all__"
              - pattern: fields = '__all__'
              - pattern: fields = ALL_FIELDS
              - pattern: exclude = []
              - pattern: exclude = ()
      - pattern: modelform_factory(..., fields="__all__", ...)
      - pattern: modelform_factory(..., fields=ALL_FIELDS, ...)
