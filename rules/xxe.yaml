rules:
  - id: thiagoteixeira.django.security.xxe.lxml-parse-without-defusedxml
    languages: [python]
    severity: WARNING
    message: >-
      Untrusted XML is being parsed with lxml (etree) rather than defusedxml. Either
      it turns entity resolution on explicitly (resolve_entities=True → XXE: a
      file:// external entity reads local files and, with no_network=False as well,
      an http:// one is SSRF), or it relies on lxml's version-dependent defaults,
      which is fragile. Route the parse through defusedxml.ElementTree (forbids entity
      declarations and external references), or build a hardened lxml parser (resolve_entities=False,
      no_network=True, load_dtd=False).
    metadata:
      # dual-listed: rule metadata is machine-read, and the Semgrep registry
      # carries both editions during the changeover
      owasp:
        - "A05:2021 - Security Misconfiguration"
        - "A02:2025 - Security Misconfiguration"
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
        - "CWE-776: Improper Restriction of Recursive Entity References in DTDs ('XML Entity Expansion')"
      asvs: "4.0.3 V5.5.2"
      confidence: MEDIUM
      references:
        - https://thiagoteixeira.tech/blog/xxe-and-xml-bombs-why-you-should-think-twice-before-parsing-xml-in-python/
        - https://github.com/PyCQA/bandit/issues/767
    # Why this rule exists (and is not just a community rule): the standard tools
    # MISS lxml XXE, empirically reproduced (see labs/post_05_xxe/scans/README.md).
    # Bandit's XML checks (B313-B319 / B405-B409) target the STDLIB parsers by import
    # name — they fire on xml.etree / minidom / sax and recommend defusedxml — but
    # Bandit's lxml checks B320 and B410 were REMOVED (Bandit 1.9.4 reports "Unknown
    # test found in profile: B410"), so Bandit is 0/0 on an lxml parse. Semgrep community packs
    # and the full r/python registry (371 rules) are also 0 on the lxml view. No
    # shipped rule gives a fire/silent assert on the lxml XXE the lab needs — and lxml
    # is exactly the parser required for a real file read, because modern stdlib
    # ElementTree no longer resolves external entities (so the parser the tools DO
    # flag is the already-hardened one).
    #
    # It fires on the explicit footgun (resolve_entities=True) and on a bare lxml
    # parse relying on implicit defaults - any etree.fromstring/parse/XML call that
    # passes no parser, positionally or as parser=, whatever other keywords it
    # passes (base_url=...) - and is silent when the parse goes through defusedxml
    # or is handed a parser (the post's Pattern 2 hardened-parser fix).
    #
    # Known limits (documented in rules/xxe.py): it is name-based (keys on an `etree`
    # receiver, so `import defusedxml.ElementTree as etree` is a false positive, todook
    # in the fixture),
    # and source-agnostic (it cannot confirm the bytes are actually untrusted). A
    # bare hardened parser passed via parser= is correctly not flagged — but so is
    # ANY parser= object, hardened or not. Silent too, checked with Semgrep 1.170.0:
    # etree.iterparse(...) and etree.ETCompatXMLParser(), which resolved external
    # entities by default until lxml 6.1.0 (CVE-2026-41066); lxml.etree.fromstring(...)
    # written out in full; and fromstring / XMLParser imported from lxml.etree. A
    # bare etree.fromstring(x) is flagged although lxml >= 6.1.3 loads no external
    # entity there (5.0 to 6.1.2 still loaded external parameter entities) —
    # deliberately, as a version-dependent default.
    patterns:
      - pattern-either:
          - pattern: etree.XMLParser(..., resolve_entities=True, ...)
          - patterns:
              - pattern-either:
                  - pattern: etree.fromstring($X, ...)
                  - pattern: etree.parse($X, ...)
                  - pattern: etree.XML($X, ...)
              # a parser handed over, positionally or by keyword, is trusted
              - pattern-not: etree.$FN($X, $PARSER, ...)
              - pattern-not: etree.$FN(..., parser=$PARSER, ...)
