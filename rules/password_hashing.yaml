rules:
  - id: thiagoteixeira.django.security.password_hashing.password-stored-as-a-fast-digest
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      A password is stored, or checked, as a digest computed with hashlib or hmac
      rather than through Django's hasher. A general-purpose hash is built to be fast,
      so once the table leaks every guess costs one hash; without a per-row salt the
      same password gives the same value in every row, and each guess is checked
      against all of them at once. The algorithm is not the problem: SHA-256 or BLAKE2
      fail the same way as SHA-1. Store passwords with user.set_password() (or
      make_password()), which uses the first entry of PASSWORD_HASHERS, a per-row salt
      and a work factor, and check them with user.check_password(). Rows already
      stored this way can be wrapped in PBKDF2 by a data migration without knowing a
      password, but a table that has already leaked is cracked anyway: reset those
      passwords.
    metadata:
      # dual-listed: rule metadata is machine-read, and the Semgrep registry
      # carries both editions during the changeover
      owasp:
        - "A02:2021 - Cryptographic Failures"
        - "A04:2025 - Cryptographic Failures"
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      asvs: "5.0.0 V11.4.2"
      confidence: HIGH
      references:
        - https://thiagoteixeira.tech/blog/
        - https://docs.djangoproject.com/en/5.2/topics/auth/passwords/
    # Why this rule exists: the standard tools key on the algorithm's NAME, not on
    # where the digest goes. Empirically, against labs/post_18_password_hashing (see
    # its scans/README.md): Bandit 1.9.4's B324 and Semgrep's
    # insecure-hash-algorithm-sha1 (pattern `hashlib.sha1(...)`, message about
    # collision resistance) fire on the vulnerable view, but also on the fix's wrapped
    # hasher, the seed, the tests and the cracker. Replace sha1 with sha256 (the
    # Semgrep rule's own autofix), sha3_256 or blake2b, and both tools, in every tier,
    # go silent on a line exactly as crackable; Bandit's suggested
    # `usedforsecurity=False` silences B324 too. No rule in the five configs mentions
    # `.password =`, make_password, PASSWORD_HASHERS or a hasher class; the two that
    # mention set_password() fire on the fix. That is the "they miss it" outcome in
    # the series' decision table (SECURITY_BLOG_SERIES_PLAN.md 6.4.1).
    #
    # Taint, because the digest often travels through a local first
    # (`digest = hashlib.sha256(...).hexdigest()`, then `user.password = digest`).
    # Sources are hashlib's digest constructors (any algorithm, and hashlib.new) and
    # hmac. The sinks are the places a password value is written or compared: an
    # assignment to `.password`, a `password=` keyword in a model's create() or a
    # queryset's update(), and an equality test against `.password` (the custom login
    # backend a hand-hashed column forces). make_password() and a hasher's encode()
    # sanitise: a digest wrapped in PBKDF2 is the documented upgrade path. So does
    # create_user(), by not being a sink: it calls set_password() on what it is given.
    #
    # Known limits, marked in rules/password_hashing.py. Not flagged (todoruleid): a
    # field with another name (`password_hash`, `pw_digest`); a raw SQL UPDATE; a
    # digest from a third-party library (passlib's md5_crypt and other fast schemes); and
    # hashlib.pbkdf2_hmac() or hashlib.scrypt() with a weak setting (a fixed salt, one
    # iteration), excluded because the same calls with sound settings are a slow KDF.
    # The weaker-hasher-in-settings mistakes (MD5PasswordHasher first in
    # PASSWORD_HASHERS, a subclass with lowered iterations) are configuration, not
    # dataflow. Flagged although harmless (todook): a model whose field is called
    # `password` but holds the digest of a long random secret (an API key, an app
    # password Django generated), where a fast hash is enough because nobody can
    # guess the input. The rule cannot see where the hashed value came from.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: hashlib.$FUNC(...)
              - pattern: hmac.new(...)
              - pattern: hmac.digest(...)
          - pattern-not: hashlib.pbkdf2_hmac(...)
          - pattern-not: hashlib.scrypt(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: make_password(...)
          - pattern: $HASHER.encode($VALUE, $SALT, ...)
          - pattern: $HASHER.encode_sha1_hash(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $USER.password = $VALUE
              - pattern: $MODEL.objects.create(..., password=$VALUE, ...)
              - pattern: $QUERYSET.update(..., password=$VALUE, ...)
              - pattern: $USER.password == $VALUE
              - pattern: $VALUE == $USER.password
          - focus-metavariable: $VALUE
