name: CI

on:
  push:
  pull_request:

jobs:
  django:
    name: Django labs (Postgres) — universal gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lab
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # Every lab's tests.py asserts the exploit succeeds on the vulnerable view
      # and is blocked on the secure one. This is the proof that holds for EVERY
      # lab, so it is the gate that must always be green.
      - name: Run migrations and tests against Postgres
        env:
          POSTGRES_HOST: 127.0.0.1
        run: |
          python manage.py migrate
          python manage.py test

  sast:
    name: SAST — Bandit + Semgrep community
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned. The Semgrep community packs (p/django) are fetched from the
      # registry, so this job is not hermetic — that is the accepted trade-off
      # for scanning with the same off-the-shelf rules an analyst runs.
      - run: pip install "bandit==1.9.4" "semgrep==1.170.0"

      # This job asserts only the labs the STANDARD tools catch — fire on the
      # vulnerable view, silent on the secure one — with each lab's rationale beside
      # its steps below: Lab 01 (SQLi), Lab 04 (command injection), Lab 08 (CSRF,
      # via Semgrep's audit tier). Labs the standard tools MISS or can't-distinguish
      # ship a custom rule and are asserted — and documented — in the custom-rules
      # job below (02, 03, 06, 07, 09). Lab 11 (brute force) has no static signal in
      # any tier: it is gated by tests.py plus a dynamic curl probe (see its scans/).

      # Lab 01 (SQL injection) — the standard tools catch it cleanly: both fire on
      # the vulnerable view and stay silent on the secure one.
      - name: Bandit fires on the vulnerable view
        run: |
          bandit -f json -o bandit_vuln.json labs/post_01_sql_injection/views_vulnerable.py || true
          python -c "import json,sys; n=len(json.load(open('bandit_vuln.json'))['results']); print('bandit findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Bandit is silent on the secure view
        run: |
          bandit -f json -o bandit_secure.json labs/post_01_sql_injection/views_secure.py || true
          python -c "import json,sys; n=len(json.load(open('bandit_secure.json'))['results']); print('bandit findings:', n); sys.exit(0 if n == 0 else 1)"

      - name: Semgrep community fires on the vulnerable view
        run: |
          semgrep scan --config p/django --json --quiet \
            labs/post_01_sql_injection/views_vulnerable.py > semgrep_vuln.json
          python -c "import json,sys; n=len(json.load(open('semgrep_vuln.json'))['results']); print('semgrep findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Semgrep community is silent on the secure view
        run: |
          semgrep scan --config p/django --json --quiet \
            labs/post_01_sql_injection/views_secure.py > semgrep_secure.json
          python -c "import json,sys; n=len(json.load(open('semgrep_secure.json'))['results']); print('semgrep findings:', n); sys.exit(0 if n == 0 else 1)"

      # Lab 04 (command injection) — Bandit B602 (shell=True), matched by test_id
      # so the secure view's low-severity subprocess noise (B603/B607/B404) does
      # not count as a finding.
      - name: Bandit B602 fires on the command-injection vulnerable view
        run: |
          bandit -f json -o cmdinj_vuln.json labs/post_04_command_injection/views_vulnerable.py || true
          python -c "import json,sys; n=sum(1 for r in json.load(open('cmdinj_vuln.json'))['results'] if r['test_id']=='B602'); print('B602 findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Bandit B602 is absent on the command-injection secure view
        run: |
          bandit -f json -o cmdinj_secure.json labs/post_04_command_injection/views_secure.py || true
          python -c "import json,sys; n=sum(1 for r in json.load(open('cmdinj_secure.json'))['results'] if r['test_id']=='B602'); print('B602 findings:', n); sys.exit(0 if n == 0 else 1)"
      - name: Semgrep community fires on the command-injection vulnerable view
        run: |
          semgrep scan --config p/django --config p/python --config p/owasp-top-ten --json --quiet \
            labs/post_04_command_injection/views_vulnerable.py > cmdinj_sem_vuln.json
          python -c "import json,sys; n=len(json.load(open('cmdinj_sem_vuln.json'))['results']); print('semgrep findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Semgrep community is silent on the command-injection secure view
        run: |
          semgrep scan --config p/django --config p/python --config p/owasp-top-ten --json --quiet \
            labs/post_04_command_injection/views_secure.py > cmdinj_sem_secure.json
          python -c "import json,sys; n=len(json.load(open('cmdinj_sem_secure.json'))['results']); print('semgrep findings:', n); sys.exit(0 if n == 0 else 1)"

      # Lab 08 (CSRF) — Semgrep's audit-tier @csrf_exempt rule. The curated packs
      # exclude it, so we point --config at the audit ruleset directly. Fires on
      # the @csrf_exempt view, silent on the @csrf_protect one. No custom rule.
      - name: Semgrep audit rule fires on the CSRF vulnerable view
        run: |
          semgrep scan --config r/python.django.security.audit.csrf-exempt --json --quiet \
            labs/post_08_csrf/views_vulnerable.py > csrf_vuln.json
          python -c "import json,sys; n=len(json.load(open('csrf_vuln.json'))['results']); print('audit-rule findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Semgrep audit rule is silent on the CSRF secure view
        run: |
          semgrep scan --config r/python.django.security.audit.csrf-exempt --json --quiet \
            labs/post_08_csrf/views_secure.py > csrf_secure.json
          python -c "import json,sys; n=len(json.load(open('csrf_secure.json'))['results']); print('audit-rule findings:', n); sys.exit(0 if n == 0 else 1)"

  custom-rules:
    name: Custom Semgrep rules (hermetic) — fixture + lab assert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Hermetic: only the in-repo rules/ are used, nothing is fetched from the
      # registry. This job owns every lab whose class the STANDARD tools can't give
      # a fire/silent assert on, so it ships a custom rule (§6.4.1). Each is
      # documented once, here, beside its assert:
      #   Lab 02 (XSS) — can't-distinguish: Bandit flags mark_safe() on BOTH views,
      #     community Semgrep flags neither. rules/xss.yaml tells them apart.
      #   Lab 03 (SSTI) — miss: both tools report nothing (no model of the
      #     Template() sink). rules/ssti.yaml is the only rule that fires.
      #   Lab 06 (IDOR) — miss: a semantic authz flaw, no dangerous call to match
      #     (Semgrep's own docs prescribe a custom rule). rules/idor.yaml.
      #   Lab 07 (privesc/mass assignment) — miss: fields='__all__' is Django-linter
      #     territory (Ruff DJ007), not SAST. rules/mass_assignment.yaml.
      #   Lab 09 (path traversal) — miss with a twist: the community
      #     path-traversal-join rule is registry-only AND its OSS engine follows only
      #     one variable indirection, missing the realistic two-hop os.path.join->open
      #     form (Pro-taint territory) — a false green. rules/path_traversal.yaml
      #     catches realistic code.
      # (Labs the standard tools DO catch are asserted in the sast job: 01 SQLi and
      # 04 command injection directly, 08 CSRF via Semgrep's audit tier. Lab 11
      # brute force ships NO rule — a forgeable key + a missing control, unmatchable
      # by any tier; gated by tests.py + a dynamic curl probe.)
      - run: pip install "semgrep==1.170.0"

      # 1. Every custom rule matches its stem-paired fixture.
      - name: Rules pass their fixtures (semgrep --test)
        run: semgrep --test --config rules/ rules/

      # 2. Each rule fires on its lab's vulnerable view and stays silent on the
      #    secure one — the scan-assert these classes otherwise can't have.
      - name: XSS rule fires on the vulnerable view
        run: |
          semgrep scan --config rules/xss.yaml --json --quiet \
            labs/post_02_xss/views_vulnerable.py > rule_vuln.json
          python -c "import json,sys; n=len(json.load(open('rule_vuln.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: XSS rule is silent on the secure view
        run: |
          semgrep scan --config rules/xss.yaml --json --quiet \
            labs/post_02_xss/views_secure.py > rule_secure.json
          python -c "import json,sys; n=len(json.load(open('rule_secure.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n == 0 else 1)"

      - name: SSTI rule fires on the vulnerable view
        run: |
          semgrep scan --config rules/ssti.yaml --json --quiet \
            labs/post_03_ssti/views_vulnerable.py > rule_ssti_vuln.json
          python -c "import json,sys; n=len(json.load(open('rule_ssti_vuln.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: SSTI rule is silent on the secure view
        run: |
          semgrep scan --config rules/ssti.yaml --json --quiet \
            labs/post_03_ssti/views_secure.py > rule_ssti_secure.json
          python -c "import json,sys; n=len(json.load(open('rule_ssti_secure.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n == 0 else 1)"

      - name: IDOR rule fires on the vulnerable view
        run: |
          semgrep scan --config rules/idor.yaml --json --quiet \
            labs/post_06_idor/views_vulnerable.py > rule_idor_vuln.json
          python -c "import json,sys; n=len(json.load(open('rule_idor_vuln.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: IDOR rule is silent on the secure view
        run: |
          semgrep scan --config rules/idor.yaml --json --quiet \
            labs/post_06_idor/views_secure.py > rule_idor_secure.json
          python -c "import json,sys; n=len(json.load(open('rule_idor_secure.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n == 0 else 1)"

      - name: Mass-assignment rule fires on the vulnerable view
        run: |
          semgrep scan --config rules/mass_assignment.yaml --json --quiet \
            labs/post_07_privesc/views_vulnerable.py > rule_ma_vuln.json
          python -c "import json,sys; n=len(json.load(open('rule_ma_vuln.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Mass-assignment rule is silent on the secure view
        run: |
          semgrep scan --config rules/mass_assignment.yaml --json --quiet \
            labs/post_07_privesc/views_secure.py > rule_ma_secure.json
          python -c "import json,sys; n=len(json.load(open('rule_ma_secure.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n == 0 else 1)"

      - name: Path-traversal rule fires on the vulnerable view
        run: |
          semgrep scan --config rules/path_traversal.yaml --json --quiet \
            labs/post_09_path_traversal/views_vulnerable.py > rule_pt_vuln.json
          python -c "import json,sys; n=len(json.load(open('rule_pt_vuln.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n >= 1 else 1)"
      - name: Path-traversal rule is silent on the secure view
        run: |
          semgrep scan --config rules/path_traversal.yaml --json --quiet \
            labs/post_09_path_traversal/views_secure.py > rule_pt_secure.json
          python -c "import json,sys; n=len(json.load(open('rule_pt_secure.json'))['results']); print('custom-rule findings:', n); sys.exit(0 if n == 0 else 1)"

  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pip-audit==2.9.0"
      # Dependency hygiene: fail if a declared dependency has a known CVE. A clean
      # run is the expected, quiet outcome.
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt
