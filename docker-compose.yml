# Local-only stack for the labs. Every port is bound to 127.0.0.1 (loopback),
# so nothing here is reachable from your LAN or the internet. See SECURITY.md —
# this project is intentionally vulnerable and must never be deployed publicly.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    # No host port is published: the web container reaches Postgres over the
    # compose network (POSTGRES_HOST=db), and publishing 5432 would collide with
    # any local Postgres the developer already runs. If you want to inspect the
    # lab DB from the host, add:  ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
             python manage.py seed_labs &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
